<h1 id="封面图目录"><a href="#封面图目录" class="headerlink" title="封面图目录"></a>封面图目录</h1><p>将你的封面图片放在这里。</p>
<h2 id="命名规则"><a href="#命名规则" class="headerlink" title="命名规则"></a>命名规则</h2><p>默认命名格式为：</p>
<p>  cover-01.jpg<br>  cover-02.jpg<br>  cover-03.jpg<br>  …（最多 cover-10.jpg）</p>
<p>如需更多图片，请同步修改 source&#x2F;js&#x2F;main.js 中的 COVERS 数组。</p>
<h2 id="支持格式"><a href="#支持格式" class="headerlink" title="支持格式"></a>支持格式</h2><p>jpg、png、webp 均可，建议尺寸 1200×630px 以上，横向比例。</p>
<h2 id="使用说明"><a href="#使用说明" class="headerlink" title="使用说明"></a>使用说明</h2><ul>
<li>文章 frontmatter 中设置了 <code>cover: /path/to/img</code> 则优先使用该图片</li>
<li>未设置 cover 的文章，主题会从本目录随机选取一张作为封面</li>
</ul>
